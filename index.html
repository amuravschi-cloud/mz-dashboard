<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metalica Zuev — Валовая прибыль</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f5f7;--sidebar:#1e293b;--sidebar-hover:#334155;--sidebar-active:#0f172a;--accent:#3b82f6;--green:#16a34a;--red:#dc2626;--orange:#f59e0b;--text:#1e293b;--text2:#64748b;--white:#fff;--border:#e2e8f0;--row-alt:#f8fafc}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;height:100vh;overflow:hidden}
/* Login overlay */
.login-overlay{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:var(--white);border-radius:16px;padding:40px;width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card .login-logo{margin-bottom:20px}
.login-card .login-logo svg{width:48px;height:48px}
.login-card h2{font-size:20px;margin-bottom:4px;color:var(--text)}
.login-card .login-sub{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;text-align:center;letter-spacing:2px;outline:none;transition:.2s}
.login-card input:focus{border-color:var(--accent)}
.login-card input.error{border-color:var(--red);animation:shake .4s}
.login-card button{width:100%;margin-top:12px;padding:12px;background:var(--sidebar);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{background:var(--accent)}
.login-card .login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}
.login-card .login-loading{color:var(--text2);font-size:12px;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* Sidebar */
.sidebar{width:220px;min-width:220px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;z-index:10}
.sidebar .logo{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sidebar .logo svg{width:36px;height:36px;flex-shrink:0}
.sidebar .logo-text{font-size:15px;font-weight:700;line-height:1.2}
.sidebar .logo-text span{display:block;font-size:11px;font-weight:400;color:#94a3b8}
.sidebar nav{flex:1;padding:12px 0}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#cbd5e1;text-decoration:none;font-size:13px;transition:.15s;cursor:pointer;border-left:3px solid transparent}
.sidebar nav a:hover{background:var(--sidebar-hover);color:#fff}
.sidebar nav a.active{background:var(--sidebar-active);color:#fff;border-left-color:var(--accent)}
.sidebar nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.sidebar nav a.active svg{opacity:1}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .year{font-weight:700;font-size:15px;color:var(--text)}
.month-chips{display:flex;gap:4px}
.month-chip{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text2);transition:.15s;user-select:none}
.month-chip.active{background:var(--sidebar);color:#fff;border-color:var(--sidebar)}
.month-chip:hover{border-color:var(--accent)}
.topbar .warehouse-filter{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.topbar select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--white)}
/* Content */
.content{flex:1;overflow-y:auto;padding:20px 24px}
.page{display:none}
.page.active{display:block}
/* KPI Cards */
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:160px;background:var(--white);border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.kpi-card .kpi-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.kpi-card .kpi-value{font-size:22px;font-weight:700;color:var(--text)}
.kpi-card .kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}
/* Tables */
.tbl-wrap{background:var(--white);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.tbl-title{padding:12px 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
th{background:#f8fafc;padding:6px 8px;text-align:left;font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0;z-index:1}
th:hover{color:var(--text)}
th.num,td.num{text-align:right;white-space:nowrap;width:1%;min-width:65px}
th .sort-arrow{font-size:9px;margin-left:3px;opacity:.4}
th.sorted .sort-arrow{opacity:1;color:var(--accent)}
td{padding:5px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
td:first-child, th:first-child{max-width:280px;min-width:140px;overflow:hidden;text-overflow:ellipsis}
td.mgr-col, th.mgr-col{width:180px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f0f4ff}
tr.group-row{cursor:pointer}
tr.group-row td{font-weight:600;background:#f8fafc}
tr.group-row:hover td{background:#eef2ff}
tr.group-row td:first-child{padding-left:10px}
tr.item-row td{font-weight:400;color:#475569}
tr.item-row td:first-child{padding-left:26px}
tr.total-row td{font-weight:700;background:#f1f5f9;border-top:2px solid var(--border)}
.expand-icon{display:inline-block;width:16px;font-size:10px;color:var(--text2);transition:.15s}
.expanded .expand-icon{transform:rotate(90deg)}
/* Cell colors */
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}
/* Compact month cell */
.mcell{line-height:1.4}
.mcell .mcell-rev{font-weight:600;font-size:12px}
.mcell .mcell-sub{font-size:10px;color:var(--text2)}
/* Channel cards */
.channel-cards{display:flex;gap:12px;margin-bottom:16px}
.channel-card{flex:1;background:var(--white);border-radius:10px;border:1px solid var(--border);padding:16px}
.channel-card h3{font-size:14px;margin-bottom:10px}
.channel-card .ch-val{font-size:20px;font-weight:700}
.channel-card .ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:12px}
.channel-card .ch-grid .ch-lbl{color:var(--text2)}
/* Utility */
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fef2f2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.hidden{display:none!important}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px}
/* Summary grid */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1200px){.summary-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#1e293b"/><path d="M10 24L18 13L26 24L34 13L42 24" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 35L18 24L26 35L34 24L42 35" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></svg>
    </div>
    <h2>METALICA ZUEV</h2>
    <div class="login-sub">Аналитика валовой прибыли</div>
    <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="off">
    <button id="loginBtn" onclick="doLogin()">Войти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Dashboard (hidden until auth) -->
<div id="dashboardWrap" style="display:none;width:100%;height:100%;display:none">

<div class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#3b82f6"/><path d="M8 18L14 10L20 18L26 10L32 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 26L14 18L20 26L26 18L32 26" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></svg>
    <div class="logo-text">METALICA ZUEV<span>Валовая прибыль</span></div>
  </div>
  <nav id="nav">
    <a data-page="summary" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Сводная</a>
    <a data-page="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>Товары</a>
    <a data-page="months"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Месяцы</a>
    <a data-page="managers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Менеджеры</a>
    <a data-page="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Клиенты</a>
    <a data-page="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18"/></svg>Группы товаров</a>
    <a data-page="structure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>Анализ структуры</a>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <span class="year">2026</span>
    <div class="month-chips" id="monthChips"></div>
    <div class="warehouse-filter" style="margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div id="mgrFilterWrap" style="display:none">Менеджер: <select id="mgrFilter"><option value="">Все менеджеры</option></select></div>
      <div>Группа: <select id="agFilter"><option value="">Все покупатели</option></select></div>
      <div>Склад: <select id="whFilter"><option value="">Все склады</option></select></div>
    </div>
  </div>
  <div class="content" id="content">
    <!-- Pages rendered by JS -->
    <div class="page active" id="page-summary"></div>
    <div class="page" id="page-products"></div>
    <div class="page" id="page-months"></div>
    <div class="page" id="page-managers"></div>
    <div class="page" id="page-clients"></div>
    <div class="page" id="page-groups"></div>
    <div class="page" id="page-structure"></div>
  </div>
</div>

</div><!-- /dashboardWrap -->


<script>
// === OLAP DATA CUBE & REACTIVE FILTERS ===
let CUBE = null;
let activeMonths = new Set();
let activeWarehouse = ""; // "" = all
let activeAccessGroup = ""; // "" = all
let activeManager = ""; // "" = all
let activePage = 'summary';
let managerChannelTab = 'all'; // 'all', 'opt', 'retail'

// Record columns mapping
// 0: month (1-9)
// 1: warehouse_idx
// 2: access_group_idx
// 3: channel_idx (0: Опт, 1: Розница)
// 4: group_idx
// 5: item_idx
// 6: client_idx
// 7: manager_idx
// 8: rev
// 9: cost
// 10: tons
// 11: tx

// === FORMATTING ===
function fmt(n, dec=0) {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n/1e6).toFixed(1).replace('.', ',') + ' млн';
  if (abs >= 1e3) return Math.round(n).toLocaleString('ru-RU');
  return n.toFixed(dec).replace('.', ',');
}
function fmtFull(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('ru-RU');
}
function fmtPct(n) { return n == null || isNaN(n) ? '—' : n.toFixed(2).replace('.', ',') + '%'; }
function fmtTons(n) { return n == null || isNaN(n) ? '—' : n.toFixed(2).replace('.', ','); }
function marginClass(m) { return m < 5 ? 'neg' : m < 10 ? 'warn' : m >= 15 ? 'pos' : ''; }

function monthCell(d) {
  if (!d || d.revenue === 0) return '<td class="num mcell"><span style="color:#ccc">—</span></td>';
  return `<td class="num mcell"><div class="mcell-rev">${fmt(d.revenue)}</div><div class="mcell-sub"><span class="${marginClass(d.margin)}">${fmtPct(d.margin)}</span> · ${fmt(d.gp)}</div></td>`;
}

// === INIT ===
function init(cubeData) {
  CUBE = cubeData;
  activeMonths = new Set(CUBE.months);
  buildMonthChips();
  buildWarehouseFilter();
  buildAccessGroupFilter();
  buildManagerFilter();
  setupNav();
  renderAll();
}

function buildMonthChips() {
  const el = document.getElementById('monthChips');
  el.innerHTML = CUBE.month_names.map((n, i) => 
    `<div class="month-chip active" data-month="${CUBE.months[i]}">${n}</div>`
  ).join('');
  el.querySelectorAll('.month-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const m = parseInt(chip.dataset.month);
      if (activeMonths.has(m)) { activeMonths.delete(m); chip.classList.remove('active'); }
      else { activeMonths.add(m); chip.classList.add('active'); }
      renderAll();
    });
  });
}

function buildWarehouseFilter() {
  const sel = document.getElementById('whFilter');
  sel.innerHTML = '<option value="">Все склады</option>';
  if (CUBE.warehouses) {
    CUBE.warehouses.forEach(w => {
      const o = document.createElement('option');
      o.value = w;
      o.textContent = w;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
      activeWarehouse = sel.value;
      renderAll();
    });
  }
}

function buildAccessGroupFilter() {
  const sel = document.getElementById('agFilter');
  sel.innerHTML = '<option value="">Все покупатели</option>';
  if (CUBE.access_groups) {
    CUBE.access_groups.forEach(ag => {
      const o = document.createElement('option');
      o.value = ag;
      o.textContent = ag;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
      activeAccessGroup = sel.value;
      renderAll();
    });
  }
}

function buildManagerFilter() {
  const sel = document.getElementById('mgrFilter');
  sel.innerHTML = '<option value="">Все менеджеры</option>';
  if (CUBE.managers) {
    const sortedMgrs = CUBE.managers.filter(m => m !== 'Без менеджера').sort();
    sortedMgrs.forEach(m => {
      const o = document.createElement('option');
      o.value = m;
      o.textContent = m;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
      activeManager = sel.value;
      renderAll();
    });
  }
}

function setupNav() {
  document.querySelectorAll('#nav a').forEach(a => {
    a.addEventListener('click', () => {
      document.querySelectorAll('#nav a').forEach(x => x.classList.remove('active'));
      a.classList.add('active');
      activePage = a.dataset.page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + activePage).classList.add('active');
      
      const mfWrap = document.getElementById('mgrFilterWrap');
      if (mfWrap) {
        mfWrap.style.display = (activePage === 'clients') ? 'block' : 'none';
      }
      
      renderAll();
    });
  });
}

// === CUBE FILTER ENGINE ===
// Fast filter across months, warehouse, access group, and manager
function getFilteredRecords(ignoreManagerFilter = false) {
  const whIdx = activeWarehouse ? CUBE.warehouses.indexOf(activeWarehouse) : -1;
  const agIdx = activeAccessGroup ? CUBE.access_groups.indexOf(activeAccessGroup) : -1;
  const mgrIdx = (!ignoreManagerFilter && activeManager) ? CUBE.managers.indexOf(activeManager) : -1;
  
  const recs = CUBE.records;
  const filtered = [];
  for (let i = 0; i < recs.length; i++) {
    const r = recs[i];
    if (!activeMonths.has(r[0])) continue;
    if (whIdx !== -1 && r[1] !== whIdx) continue;
    if (agIdx !== -1 && r[2] !== agIdx) continue;
    if (mgrIdx !== -1 && r[7] !== mgrIdx) continue;
    filtered.push(r);
  }
  return filtered;
}

function recalcKPI(records) {
  let rev = 0, cost = 0, tons = 0;
  for (let i = 0; i < records.length; i++) {
    rev += records[i][8];
    cost += records[i][9];
    tons += records[i][10];
  }
  const gp = rev - cost;
  return {
    revenue: rev,
    cost: cost,
    gp: gp,
    margin: rev ? (gp / rev * 100) : 0,
    tons: tons,
    gp_per_ton: tons ? (gp / tons) : 0
  };
}

// === SORTING ===
function sortTable(table, col, numeric=true) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr.sortable-row'));
  const th = table.querySelectorAll('th')[col];
  const asc = th.classList.contains('sorted-asc');
  table.querySelectorAll('th').forEach(h => { h.classList.remove('sorted','sorted-asc','sorted-desc'); });
  th.classList.add('sorted', asc ? 'sorted-desc' : 'sorted-asc');
  rows.sort((a, b) => {
    let va = a.cells[col]?.getAttribute('data-val') || a.cells[col]?.textContent || '';
    let vb = b.cells[col]?.getAttribute('data-val') || b.cells[col]?.textContent || '';
    if (numeric) {
      va = parseFloat(va.replace(/[^\d,.\-]/g,'').replace(',','.')) || 0;
      vb = parseFloat(vb.replace(/[^\d,.\-]/g,'').replace(',','.')) || 0;
    }
    return asc ? va - vb : vb - va;
  });
  rows.forEach(r => tbody.appendChild(r));
}

// === RENDER DISPATCHER ===
function renderAll() {
  const records = getFilteredRecords();
  const kpi = recalcKPI(records);
  
  if (activePage === 'summary') renderSummary(kpi, records);
  else if (activePage === 'products') renderProducts(kpi, records);
  else if (activePage === 'months') renderMonths(kpi, records);
  else if (activePage === 'managers') renderManagers(kpi, records);
  else if (activePage === 'clients') renderClients(kpi, records);
  else if (activePage === 'groups') renderGroups(kpi, records);
  else if (activePage === 'structure') renderStructure(kpi, records);
}

function renderKPICards(kpi) {
  return `<div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">💰 Выручка без НДС</div><div class="kpi-value">${fmt(kpi.revenue)}</div><div class="kpi-sub">лей</div></div>
    <div class="kpi-card"><div class="kpi-label">📦 Себестоимость</div><div class="kpi-value">${fmt(kpi.cost)}</div><div class="kpi-sub">лей</div></div>
    <div class="kpi-card"><div class="kpi-label">📈 Валовая прибыль</div><div class="kpi-value">${fmt(kpi.gp)}</div><div class="kpi-sub">лей</div></div>
    <div class="kpi-card"><div class="kpi-label">% Маржа</div><div class="kpi-value ${marginClass(kpi.margin)}">${fmtPct(kpi.margin)}</div></div>
    <div class="kpi-card"><div class="kpi-label">⚖️ Объём</div><div class="kpi-value">${fmtTons(kpi.tons)}</div><div class="kpi-sub">тонн</div></div>
    <div class="kpi-card"><div class="kpi-label">💎 Прибыль/т</div><div class="kpi-value">${fmtFull(Math.round(kpi.gp_per_ton))}</div><div class="kpi-sub">лей/т</div></div>
  </div>`;
}

// === 1. SUMMARY ===
function renderSummary(kpi, records) {
  const el = document.getElementById('page-summary');
  
  // Channels
  let optRev = 0, optCost = 0, optTons = 0, optClients = new Set();
  let retRev = 0, retCost = 0, retTons = 0, retClients = new Set();
  
  // Groups
  const grpMap = {};
  CUBE.groups.forEach((g, idx) => {
    grpMap[idx] = { name: g, rev: 0, cost: 0, tons: 0 };
  });
  
  // Top Clients
  const clientMap = {};
  // Top Wholesale Managers
  const mgrMap = {};

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const ch = r[3]; // 0: opt, 1: ret
    const rev = r[8], cost = r[9], tons = r[10];
    
    if (ch === 0) {
      optRev += rev; optCost += cost; optTons += tons; optClients.add(r[6]);
      // Client
      const cid = r[6];
      if (!clientMap[cid]) clientMap[cid] = { rev: 0, cost: 0, tons: 0 };
      clientMap[cid].rev += rev;
      clientMap[cid].cost += cost;
      clientMap[cid].tons += tons;
      // Manager
      const mid = r[7];
      if (!mgrMap[mid]) mgrMap[mid] = { rev: 0, cost: 0, tons: 0, clients: new Set() };
      mgrMap[mid].rev += rev;
      mgrMap[mid].cost += cost;
      mgrMap[mid].tons += tons;
      mgrMap[mid].clients.add(cid);
    } else {
      retRev += rev; retCost += cost; retTons += tons; retClients.add(r[6]);
    }
    
    const gid = r[4];
    if (grpMap[gid]) {
      grpMap[gid].rev += rev;
      grpMap[gid].cost += cost;
      grpMap[gid].tons += tons;
    }
  }

  const optGP = optRev - optCost;
  const retGP = retRev - retCost;
  
  const chData = [
    { type: 'Опт', revenue: optRev, gp: optGP, margin: optRev ? optGP/optRev*100 : 0, gp_per_ton: optTons ? optGP/optTons : 0, clients: optClients.size },
    { type: 'Розница', revenue: retRev, gp: retGP, margin: retRev ? retGP/retRev*100 : 0, gp_per_ton: retTons ? retGP/retTons : 0, clients: retClients.size }
  ];

  const grps = Object.values(grpMap).filter(g => g.rev > 0).map(g => {
    const gp = g.rev - g.cost;
    return { name: g.name, rev: g.rev, gp: gp, margin: g.rev ? gp/g.rev*100 : 0, tons: g.tons, gp_t: g.tons ? gp/g.tons : 0 };
  }).sort((a,b) => b.rev - a.rev);

  const topClients = Object.entries(clientMap).map(([cid, d]) => {
    const gp = d.rev - d.cost;
    return { name: CUBE.clients[parseInt(cid)], rev: d.rev, gp: gp, margin: d.rev ? gp/d.rev*100 : 0 };
  }).sort((a,b) => b.rev - a.rev).slice(0, 10);

  const topMgrs = Object.entries(mgrMap).map(([mid, d]) => {
    const gp = d.rev - d.cost;
    return { name: CUBE.managers[parseInt(mid)], rev: d.rev, gp: gp, margin: d.rev ? gp/d.rev*100 : 0, gp_t: d.tons ? gp/d.tons : 0, clients: d.clients.size };
  }).sort((a,b) => b.rev - a.rev).slice(0, 10);

  el.innerHTML = renderKPICards(kpi) + `
  <div class="channel-cards">
    ${chData.map(ch => `
      <div class="channel-card"><h3>${ch.type === 'Опт' ? '🏢 Опт' : '🛒 Розница'}</h3>
        <div class="ch-val">${fmt(ch.revenue)}</div>
        <div class="ch-grid">
          <span class="ch-lbl">Клиентов</span><span>${ch.clients}</span>
          <span class="ch-lbl">Маржа</span><span class="${marginClass(ch.margin)}">${fmtPct(ch.margin)}</span>
          <span class="ch-lbl">Прибыль/т</span><span>${fmtFull(Math.round(ch.gp_per_ton))}</span>
          <span class="ch-lbl">Доля прибыли</span><span>${kpi.gp ? (ch.gp / kpi.gp * 100).toFixed(1) : 0}%</span>
        </div>
      </div>
    `).join('')}
  </div>
  <div class="summary-grid">
    <div class="tbl-wrap"><div class="tbl-title">Группы товаров</div>
      <table><thead><tr><th>Группа</th><th class="num">Тоннаж</th><th class="num">Прибыль</th><th class="num">Маржа</th><th class="num">Приб./т</th></tr></thead>
      <tbody>${grps.map(g => `<tr class="sortable-row"><td>${g.name}</td><td class="num" data-val="${g.tons}">${fmtTons(g.tons)}</td><td class="num" data-val="${g.gp}">${fmt(g.gp)}</td><td class="num ${marginClass(g.margin)}" data-val="${g.margin}">${fmtPct(g.margin)}</td><td class="num" data-val="${g.gp_t}">${fmtFull(Math.round(g.gp_t))}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="tbl-wrap"><div class="tbl-title">ТОП клиенты (опт)</div>
      <table><thead><tr><th>Клиент</th><th class="num">Оборот</th><th class="num">Прибыль</th><th class="num">Маржа</th></tr></thead>
      <tbody>${topClients.map(c => `<tr class="sortable-row"><td>${c.name}</td><td class="num" data-val="${c.revenue}">${fmt(c.revenue)}</td><td class="num" data-val="${c.gp}">${fmt(c.gp)}</td><td class="num ${marginClass(c.margin)}" data-val="${c.margin}">${fmtPct(c.margin)}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="tbl-wrap"><div class="tbl-title">ТОП менеджеры (опт)</div>
      <table><thead><tr><th>Менеджер</th><th class="num">Клиентов</th><th class="num">Оборот</th><th class="num">Маржа</th><th class="num">Приб./т</th></tr></thead>
      <tbody>${topMgrs.map(m => `<tr class="sortable-row"><td><strong>${m.name}</strong></td><td class="num" data-val="${m.clients}">${m.clients}</td><td class="num" data-val="${m.rev}">${fmt(m.rev)}</td><td class="num ${marginClass(m.margin)}" data-val="${m.margin}">${fmtPct(m.margin)}</td><td class="num" data-val="${m.gp_t}">${fmtFull(Math.round(m.gp_t))}</td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>`;
  setupSortHandlers(el);
}

// === 2. PRODUCTS ===
function renderProducts(kpi, records) {
  const el = document.getElementById('page-products');
  const months = CUBE.months.filter(m => activeMonths.has(m));
  const monthHeaders = months.map(m => `<th class="num">${CUBE.month_names[CUBE.months.indexOf(m)]}</th>`).join('');

  // Group -> Items -> Month breakdown
  const grpMap = {};
  CUBE.groups.forEach((g, gi) => {
    grpMap[gi] = { name: g, rev: 0, gp: 0, tons: 0, monthly: {}, items: {} };
  });

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const m = r[0], gid = r[4], iid = r[5];
    const rev = r[8], cost = r[9], tons = r[10], gp = rev - cost;
    
    const g = grpMap[gid];
    if (!g) continue;
    g.rev += rev; g.gp += gp; g.tons += tons;
    if (!g.monthly[m]) g.monthly[m] = { rev: 0, gp: 0, tons: 0 };
    g.monthly[m].rev += rev; g.monthly[m].gp += gp; g.monthly[m].tons += tons;
    
    if (!g.items[iid]) g.items[iid] = { name: CUBE.items[iid], rev: 0, gp: 0, tons: 0, monthly: {} };
    const it = g.items[iid];
    it.rev += rev; it.gp += gp; it.tons += tons;
    if (!it.monthly[m]) it.monthly[m] = { rev: 0, gp: 0, tons: 0 };
    it.monthly[m].rev += rev; it.monthly[m].gp += gp; it.monthly[m].tons += tons;
  }

  let rows = '';
  Object.entries(grpMap).forEach(([gi, g]) => {
    if (g.rev === 0) return;
    const margin = g.rev ? (g.gp / g.rev * 100) : 0;
    const mCells = months.map(m => {
      const d = g.monthly[m];
      return monthCell(d ? { revenue: d.rev, gp: d.gp, margin: d.rev ? d.gp/d.rev*100 : 0 } : null);
    }).join('');

    rows += `<tr class="group-row sortable-row" data-group="${gi}" onclick="toggleGroup(this, ${gi})">
      <td><span class="expand-icon">▸</span> ${g.name}</td>
      <td class="num" data-val="${g.rev}"><div class="mcell"><div class="mcell-rev">${fmt(g.rev)}</div><div class="mcell-sub"><span class="${marginClass(margin)}">${fmtPct(margin)}</span> · ${fmt(g.gp)}</div><div class="mcell-sub">${fmtTons(g.tons)} т</div></div></td>
      ${mCells}</tr>`;

    const sortedItems = Object.values(g.items).sort((a,b) => b.rev - a.rev);
    sortedItems.forEach(item => {
      const imargin = item.rev ? (item.gp / item.rev * 100) : 0;
      const imCells = months.map(m => {
        const d = item.monthly[m];
        return monthCell(d ? { revenue: d.rev, gp: d.gp, margin: d.rev ? d.gp/d.rev*100 : 0 } : null);
      }).join('');
      rows += `<tr class="item-row hidden" data-parent="${gi}">
        <td>${item.name}</td>
        <td class="num" data-val="${item.rev}"><div class="mcell"><div class="mcell-rev">${fmt(item.rev)}</div><div class="mcell-sub"><span class="${marginClass(imargin)}">${fmtPct(imargin)}</span> · ${fmt(item.gp)}</div></div></td>
        ${imCells}</tr>`;
    });
  });

  // Total row across months
  const monthTotals = {};
  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const m = r[0];
    if (!monthTotals[m]) monthTotals[m] = { rev: 0, gp: 0 };
    monthTotals[m].rev += r[8];
    monthTotals[m].gp += (r[8] - r[9]);
  }
  const tMCells = months.map(m => {
    const d = monthTotals[m];
    return monthCell(d ? { revenue: d.rev, gp: d.gp, margin: d.rev ? d.gp/d.rev*100 : 0 } : null);
  }).join('');

  rows += `<tr class="total-row"><td>Итого</td>
    <td class="num"><div class="mcell"><div class="mcell-rev">${fmt(kpi.revenue)}</div><div class="mcell-sub"><span class="${marginClass(kpi.margin)}">${fmtPct(kpi.margin)}</span> · ${fmt(kpi.gp)}</div><div class="mcell-sub">${fmtTons(kpi.tons)} т</div></div></td>
    ${tMCells}</tr>`;

  el.innerHTML = renderKPICards(kpi) + `
  <div class="tbl-wrap"><div class="tbl-title">Продажи по номенклатуре</div>
    <div class="tbl-scroll"><table><thead><tr><th>Номенклатура</th><th class="num">ИТОГО</th>${monthHeaders}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
  setupSortHandlers(el);
}

function toggleGroup(tr, gi) {
  tr.classList.toggle('expanded');
  const table = tr.closest('table');
  table.querySelectorAll(`tr[data-parent="${gi}"]`).forEach(r => r.classList.toggle('hidden'));
}

// === 3. MONTHS ===
function renderMonths(kpi, records) {
  const el = document.getElementById('page-months');
  const months = CUBE.months.filter(m => activeMonths.has(m));
  
  const monthMap = {};
  months.forEach(m => {
    monthMap[m] = { month: m, name: CUBE.month_names[m-1], revenue: 0, cost: 0, tons: 0 };
  });

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const m = r[0];
    if (monthMap[m]) {
      monthMap[m].revenue += r[8];
      monthMap[m].cost += r[9];
      monthMap[m].tons += r[10];
    }
  }

  let prevGP = null;
  const rows = months.map(m => {
    const d = monthMap[m];
    const gp = d.revenue - d.cost;
    const margin = d.revenue ? (gp / d.revenue * 100) : 0;
    const gpt = d.tons ? (gp / d.tons) : 0;
    const delta = prevGP !== null ? (gp - prevGP) : null;
    const deltaPct = prevGP ? ((gp - prevGP) / prevGP * 100) : null;
    prevGP = gp;
    return `<tr class="sortable-row">
      <td><strong>${d.name}</strong></td>
      <td class="num" data-val="${d.revenue}">${fmtFull(Math.round(d.revenue))}</td>
      <td class="num" data-val="${d.tons}">${fmtTons(d.tons)}</td>
      <td class="num ${marginClass(margin)}" data-val="${margin}">${fmtPct(margin)}</td>
      <td class="num" data-val="${gp}">${fmtFull(Math.round(gp))}</td>
      <td class="num" data-val="${gpt}">${fmtFull(Math.round(gpt))}</td>
      <td class="num ${delta !== null ? (delta >= 0 ? 'pos' : 'neg') : ''}" data-val="${delta||0}">${delta !== null ? (delta >= 0 ? '+' : '') + fmt(delta) + (deltaPct !== null ? ' (' + (deltaPct >= 0 ? '+' : '') + deltaPct.toFixed(1) + '%)' : '') : '—'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = renderKPICards(kpi) + `
  <div class="tbl-wrap"><div class="tbl-title">Результат по месяцам</div>
    <table id="tblMonths"><thead><tr><th>Месяц</th><th class="num">Оборот</th><th class="num">Тонны</th><th class="num">Маржа %</th><th class="num">Вал. прибыль</th><th class="num">Прибыль/т</th><th class="num">Δ прибыли</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
  setupSortHandlers(el);
}

// === 4. MANAGERS ===
function renderManagers(kpi, records) {
  const el = document.getElementById('page-managers');
  const months = CUBE.months.filter(m => activeMonths.has(m));
  const mHeaders = months.map(m => `<th class="num">${CUBE.month_names[CUBE.months.indexOf(m)]}</th>`).join('');

  // Calculate separated wholesale & retail managers
  const optMgrMap = {}, retMgrMap = {};
  let optRev = 0, optCost = 0, optTons = 0;
  let retRev = 0, retCost = 0, retTons = 0;

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const ch = r[3]; // 0: opt, 1: ret
    const m = r[0], mid = r[7], cid = r[6];
    const rev = r[8], cost = r[9], tons = r[10], gp = rev - cost, tx = r[11];
    
    if (ch === 0) {
      optRev += rev; optCost += cost; optTons += tons;
      if (!optMgrMap[mid]) optMgrMap[mid] = { name: CUBE.managers[mid], rev: 0, cost: 0, tons: 0, tx: 0, clients: new Set(), monthly: {} };
      const om = optMgrMap[mid];
      om.rev += rev; om.cost += cost; om.tons += tons; om.tx += tx; om.clients.add(cid);
      if (!om.monthly[m]) om.monthly[m] = { rev: 0, gp: 0 };
      om.monthly[m].rev += rev; om.monthly[m].gp += gp;
    } else {
      retRev += rev; retCost += cost; retTons += tons;
      if (!retMgrMap[mid]) retMgrMap[mid] = { name: CUBE.managers[mid], rev: 0, cost: 0, tons: 0, tx: 0, clients: new Set(), monthly: {} };
      const rm = retMgrMap[mid];
      rm.rev += rev; rm.cost += cost; rm.tons += tons; rm.tx += tx; rm.clients.add(cid);
      if (!rm.monthly[m]) rm.monthly[m] = { rev: 0, gp: 0 };
      rm.monthly[m].rev += rev; rm.monthly[m].gp += gp;
    }
  }

  const optGP = optRev - optCost;
  const retGP = retRev - retCost;
  const optMargin = optRev ? (optGP / optRev * 100) : 0;
  const retMargin = retRev ? (retGP / retRev * 100) : 0;
  const totalRev = optRev + retRev;
  const retShareRev = totalRev ? (retRev / totalRev * 100) : 0;
  const retShareGP = (optGP + retGP) ? (retGP / (optGP + retGP) * 100) : 0;

  function renderTableRows(mgrDict, isRetail) {
    const list = Object.values(mgrDict).sort((a,b) => b.rev - a.rev);
    return list.map(m => {
      const gp = m.rev - m.cost;
      const margin = m.rev ? (gp / m.rev * 100) : 0;
      const gpt = m.tons ? (gp / m.tons) : 0;
      const avg = m.tx ? (m.rev / m.tx) : 0;
      const mCells = months.map(mo => {
        const d = m.monthly[mo];
        return monthCell(d ? { revenue: d.rev, gp: d.gp, margin: d.rev ? d.gp/d.rev*100 : 0 } : null);
      }).join('');
      const tagCls = isRetail ? 'badge-blue' : 'badge-green';
      
      const clickAction = !isRetail && m.name !== 'Без менеджера' 
        ? `onclick="filterClientsByManager('${m.name.replace(/'/g, "\\'")}')" style="cursor:pointer;text-decoration:underline;" title="Нажмите, чтобы увидеть клиентов этого менеджера"`
        : '';
        
      return `<tr class="sortable-row">
        <td><strong ${clickAction}>${m.name}</strong> <span class="badge ${tagCls}" style="font-size:9px;margin-left:4px">${isRetail ? 'Розница' : 'Опт'}</span></td>
        <td class="num" data-val="${m.clients.size}">${m.clients.size}</td>
        <td class="num" data-val="${m.tx}">${m.tx}</td>
        <td class="num" data-val="${m.rev}"><div class="mcell"><div class="mcell-rev">${fmt(m.rev)}</div><div class="mcell-sub"><span class="${marginClass(margin)}">${fmtPct(margin)}</span> · ${fmt(gp)}</div><div class="mcell-sub">${fmtTons(m.tons)} т</div></div></td>
        <td class="num" data-val="${gpt}">${fmtFull(Math.round(gpt))}</td>
        <td class="num" data-val="${avg}">${fmtFull(Math.round(avg))}</td>
        ${mCells}</tr>`;
    }).join('');
  }

  const optRows = renderTableRows(optMgrMap, false);
  const retRows = renderTableRows(retMgrMap, true);
  const optCount = Object.keys(optMgrMap).length;
  const retCount = Object.keys(retMgrMap).length;

  const btnAll = `<button onclick="setManagerTab('all')" class="month-chip ${managerChannelTab==='all'?'active':''}" style="font-weight:600">Все разделы</button>`;
  const btnOpt = `<button onclick="setManagerTab('opt')" class="month-chip ${managerChannelTab==='opt'?'active':''}" style="font-weight:600">🏢 Только Опт (${optCount})</button>`;
  const btnRet = `<button onclick="setManagerTab('retail')" class="month-chip ${managerChannelTab==='retail'?'active':''}" style="font-weight:600">🛒 Только Розница (${retCount})</button>`;

  let tablesHTML = '';
  if (managerChannelTab === 'all' || managerChannelTab === 'opt') {
    tablesHTML += `
    <div class="tbl-wrap" style="margin-bottom:24px;">
      <div class="tbl-title" style="background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
        <div>🏢 <strong>Менеджеры оптовых юридических клиентов</strong> (${optCount} ответственных)</div>
        <div style="font-size:12px;color:var(--text2)">Оборот: <strong>${fmt(optRev)} лей</strong> (${fmtPct(optMargin)} маржа) · Тоннаж: <strong>${fmtTons(optTons)} т</strong></div>
      </div>
      <div class="tbl-scroll"><table><thead><tr><th>Менеджер (нажмите для перехода к клиентам)</th><th class="num">Клиентов</th><th class="num">Транз.</th><th class="num">ИТОГО</th><th class="num">Приб./т</th><th class="num">Ср. чек</th>${mHeaders}</tr></thead>
      <tbody>${optRows}</tbody></table></div>
    </div>`;
  }

  if (managerChannelTab === 'all' || managerChannelTab === 'retail') {
    tablesHTML += `
    <div class="tbl-wrap">
      <div class="tbl-title" style="background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
        <div>🛒 <strong>Розничные продажи менеджеров (частные лица)</strong> (${retCount} менеджеров)</div>
        <div style="font-size:12px;color:var(--text2)">Оборот: <strong>${fmt(retRev)} лей</strong> (${fmtPct(retMargin)} маржа) · Тоннаж: <strong>${fmtTons(retTons)} т</strong></div>
      </div>
      <div class="tbl-scroll"><table><thead><tr><th>Менеджер (розница)</th><th class="num">Чеков</th><th class="num">Транз.</th><th class="num">ИТОГО</th><th class="num">Приб./т</th><th class="num">Ср. чек</th>${mHeaders}</tr></thead>
      <tbody>${retRows}</tbody></table></div>
    </div>`;
  }

  el.innerHTML = `
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">🏢 Оборот Опта</div><div class="kpi-value">${fmt(optRev)}</div><div class="kpi-sub">${(100-retShareRev).toFixed(1)}% от общего оборота · маржа ${fmtPct(optMargin)}</div></div>
    <div class="kpi-card"><div class="kpi-label">🛒 Оборот Розницы</div><div class="kpi-value" style="color:var(--accent)">${fmt(retRev)}</div><div class="kpi-sub"><strong>${retShareRev.toFixed(1)}%</strong> от общего оборота · маржа <strong>${fmtPct(retMargin)}</strong></div></div>
    <div class="kpi-card"><div class="kpi-label">📈 Прибыль Опта</div><div class="kpi-value">${fmt(optGP)}</div><div class="kpi-sub">${(100-retShareGP).toFixed(1)}% прибыли</div></div>
    <div class="kpi-card"><div class="kpi-label">📈 Прибыль Розницы</div><div class="kpi-value pos">${fmt(retGP)}</div><div class="kpi-sub"><strong>${retShareGP.toFixed(1)}%</strong> прибыли компании</div></div>
    <div class="kpi-card"><div class="kpi-label">💎 Прибыль/т (Розница vs Опт)</div><div class="kpi-value pos">${fmtFull(Math.round(retTons ? retGP/retTons : 0))}</div><div class="kpi-sub">в опте: ${fmtFull(Math.round(optTons ? optGP/optTons : 0))} лей/т (+${Math.round(((retGP/retTons)/(optGP/optTons||1)-1)*100)}%)</div></div>
  </div>
  
  <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;">
    <span style="font-weight:600;font-size:12px;color:var(--text2)">Переключение каналов:</span>
    ${btnAll} ${btnOpt} ${btnRet}
  </div>

  ${tablesHTML}`;
  setupSortHandlers(el);
}

window.setManagerTab = function(tab) {
  managerChannelTab = tab;
  renderManagers(recalcKPI(getFilteredRecords()), getFilteredRecords());
};

window.filterClientsByManager = function(mgrName) {
  document.querySelectorAll('#nav a').forEach(x => x.classList.remove('active'));
  const clLink = document.querySelector('#nav a[data-page="clients"]');
  if (clLink) clLink.classList.add('active');
  activePage = 'clients';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-clients').classList.add('active');
  
  const mfWrap = document.getElementById('mgrFilterWrap');
  if (mfWrap) mfWrap.style.display = 'block';
  const sel = document.getElementById('mgrFilter');
  if (sel) sel.value = mgrName;
  activeManager = mgrName;
  
  renderAll();
};

// === 5. CLIENTS ===
function renderClients(kpi, records) {
  const el = document.getElementById('page-clients');

  // Group clients by CID
  const optClientMap = {}, retClientMap = {};

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const ch = r[3];
    const cid = r[6], mid = r[7], agid = r[2];
    const rev = r[8], cost = r[9], tons = r[10], tx = r[11];
    
    const targetMap = (ch === 0) ? optClientMap : retClientMap;
    if (!targetMap[cid]) {
      targetMap[cid] = {
        name: CUBE.clients[cid],
        manager: CUBE.managers[mid],
        access_group: CUBE.access_groups[agid],
        rev: 0, cost: 0, tons: 0, tx: 0
      };
    }
    const c = targetMap[cid];
    c.rev += rev; c.cost += cost; c.tons += tons; c.tx += tx;
  }

  const opt = Object.values(optClientMap).sort((a,b) => b.rev - a.rev);
  const ret = Object.values(retClientMap).sort((a,b) => b.rev - a.rev);

  function clientRows(list) {
    if (list.length === 0) {
      return `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text2)">Клиентов не найдено по выбранным фильтрам</td></tr>`;
    }
    return list.map(c => {
      const gp = c.rev - c.cost;
      const margin = c.rev ? (gp / c.rev * 100) : 0;
      const gpt = c.tons ? (gp / c.tons) : 0;
      return `<tr class="sortable-row">
        <td><strong>${c.name}</strong></td>
        <td class="mgr-col">${c.manager && c.manager !== 'Без менеджера' ? `<span class="badge badge-blue">${c.manager}</span>` : '<span style="color:#94a3b8">Без менеджера</span>'}</td>
        <td class="num" data-val="${c.tx}">${c.tx}</td>
        <td class="num" data-val="${c.rev}">${fmtFull(Math.round(c.rev))}</td>
        <td class="num" data-val="${c.tons}">${fmtTons(c.tons)}</td>
        <td class="num ${marginClass(margin)}" data-val="${margin}">${fmtPct(margin)}</td>
        <td class="num" data-val="${gp}">${fmtFull(Math.round(gp))}</td>
        <td class="num" data-val="${gpt}">${fmtFull(Math.round(gpt))}</td>
      </tr>`;
    }).join('');
  }

  // Concentration
  const allOpt = opt.slice().sort((a,b) => (b.rev-b.cost) - (a.rev-a.cost));
  const totalOptGP = allOpt.reduce((s,c) => s + (c.rev-c.cost), 0);
  const top10gp = allOpt.slice(0,10).reduce((s,c) => s + (c.rev-c.cost), 0);
  const top20gp = allOpt.slice(0,20).reduce((s,c) => s + (c.rev-c.cost), 0);
  const top50gp = allOpt.slice(0,50).reduce((s,c) => s + (c.rev-c.cost), 0);

  const filterDesc = [
    activeManager ? `Менеджер: <strong>${activeManager}</strong>` : null,
    activeAccessGroup ? `Группа: <strong>${activeAccessGroup}</strong>` : null,
    activeWarehouse ? `Склад: <strong>${activeWarehouse}</strong>` : null
  ].filter(Boolean).join(' · ');

  el.innerHTML = renderKPICards(kpi) + `
  ${filterDesc ? `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
    <div>🔍 Активный фильтр: ${filterDesc} (Найдено оптовых клиентов: <strong>${opt.length}</strong>)</div>
    <button onclick="document.getElementById('mgrFilter').value='';document.getElementById('agFilter').value='';document.getElementById('whFilter').value='';activeManager='';activeAccessGroup='';activeWarehouse='';renderAll();" style="padding:4px 8px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer;font-size:11px">Сбросить фильтры</button>
  </div>` : ''}

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">ТОП-10 клиентов</div><div class="kpi-value">${totalOptGP ? (top10gp/totalOptGP*100).toFixed(1) : 0}%</div><div class="kpi-sub">прибыли выборки</div></div>
    <div class="kpi-card"><div class="kpi-label">ТОП-20 клиентов</div><div class="kpi-value">${totalOptGP ? (top20gp/totalOptGP*100).toFixed(1) : 0}%</div><div class="kpi-sub">прибыли выборки</div></div>
    <div class="kpi-card"><div class="kpi-label">ТОП-50 клиентов</div><div class="kpi-value">${totalOptGP ? (top50gp/totalOptGP*100).toFixed(1) : 0}%</div><div class="kpi-sub">прибыли выборки</div></div>
    <div class="kpi-card"><div class="kpi-label">Остальные клиенты</div><div class="kpi-value">${totalOptGP ? ((totalOptGP-top50gp)/totalOptGP*100).toFixed(1) : 0}%</div><div class="kpi-sub">прибыли выборки</div></div>
  </div>

  <div class="tbl-wrap" style="margin-bottom:24px;">
    <div class="tbl-title">🏢 Оптовые клиенты (${opt.length} контрагентов)</div>
    <div class="tbl-scroll"><table><thead><tr><th>Клиент</th><th class="mgr-col">Ответственный менеджер</th><th class="num">Транз.</th><th class="num">Оборот</th><th class="num">Тонны</th><th class="num">Маржа</th><th class="num">Прибыль</th><th class="num">Приб./т</th></tr></thead>
    <tbody>${clientRows(opt)}</tbody></table></div>
  </div>

  ${!activeManager ? `
  <div class="tbl-wrap">
    <div class="tbl-title">🛒 Розничные продажи (${ret.length} менеджеров)</div>
    <div class="tbl-scroll"><table><thead><tr><th>Клиент</th><th class="mgr-col">Ответственный менеджер</th><th class="num">Транз.</th><th class="num">Оборот</th><th class="num">Тонны</th><th class="num">Маржа</th><th class="num">Прибыль</th><th class="num">Приб./т</th></tr></thead>
    <tbody>${clientRows(ret)}</tbody></table></div>
  </div>` : ''}`;
  setupSortHandlers(el);
}

// === 6. GROUPS ===
function renderGroups(kpi, records) {
  const el = document.getElementById('page-groups');

  const grpMap = {};
  CUBE.groups.forEach((g, gi) => {
    grpMap[gi] = { name: g, rev: 0, cost: 0, tons: 0 };
  });

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const gid = r[4];
    if (grpMap[gid]) {
      grpMap[gid].rev += r[8];
      grpMap[gid].cost += r[9];
      grpMap[gid].tons += r[10];
    }
  }

  const grps = Object.values(grpMap).filter(g => g.rev > 0).map(g => {
    const gp = g.rev - g.cost;
    return {
      name: g.name,
      fRev: g.rev,
      fGP: gp,
      fTons: g.tons,
      fMargin: g.rev ? (gp / g.rev * 100) : 0,
      fGPT: g.tons ? (gp / g.tons) : 0,
      fShareTons: kpi.tons ? (g.tons / kpi.tons * 100) : 0,
      fShareRev: kpi.revenue ? (g.rev / kpi.revenue * 100) : 0,
      fShareGP: kpi.gp ? (gp / kpi.gp * 100) : 0
    };
  }).sort((a,b) => b.fRev - a.fRev);

  const rows = grps.map(g => `<tr class="sortable-row">
    <td><strong>${g.name}</strong></td>
    <td class="num" data-val="${g.fTons}">${fmtTons(g.fTons)}</td>
    <td class="num" data-val="${g.fShareTons}">${g.fShareTons.toFixed(1)}%</td>
    <td class="num" data-val="${g.fRev}">${fmtFull(Math.round(g.fRev))}</td>
    <td class="num" data-val="${g.fShareRev}">${g.fShareRev.toFixed(1)}%</td>
    <td class="num ${marginClass(g.fMargin)}" data-val="${g.fMargin}">${fmtPct(g.fMargin)}</td>
    <td class="num" data-val="${g.fGP}">${fmtFull(Math.round(g.fGP))}</td>
    <td class="num" data-val="${g.fShareGP}">${g.fShareGP.toFixed(1)}%</td>
    <td class="num" data-val="${g.fGPT}">${fmtFull(Math.round(g.fGPT))}</td>
    <td class="num" data-val="${g.fShareTons ? (g.fShareGP/g.fShareTons) : 0}"><span class="${g.fShareGP > g.fShareTons*1.1 ? 'pos' : g.fShareGP < g.fShareTons*0.9 ? 'neg' : ''}">${g.fShareTons ? (g.fShareGP/g.fShareTons).toFixed(2) : '—'}</span></td>
  </tr>`).join('');

  el.innerHTML = renderKPICards(kpi) + `
  <div class="tbl-wrap"><div class="tbl-title">Экономика ассортимента</div>
    <div class="tbl-scroll"><table><thead><tr><th>Группа</th><th class="num">Тонны</th><th class="num">% тонн</th><th class="num">Оборот</th><th class="num">% оборот</th><th class="num">Маржа</th><th class="num">Вал. прибыль</th><th class="num">% прибыли</th><th class="num">Приб./т</th><th class="num">Коэфф.</th></tr></thead>
    <tbody>${rows}
    <tr class="total-row"><td>Итого</td><td class="num">${fmtTons(kpi.tons)}</td><td class="num">100%</td><td class="num">${fmtFull(Math.round(kpi.revenue))}</td><td class="num">100%</td><td class="num ${marginClass(kpi.margin)}">${fmtPct(kpi.margin)}</td><td class="num">${fmtFull(Math.round(kpi.gp))}</td><td class="num">100%</td><td class="num">${fmtFull(Math.round(kpi.gp_per_ton))}</td><td class="num">1,00</td></tr>
    </tbody></table></div>
  </div>
  <p style="font-size:11px;color:var(--text2);margin-top:4px">Коэфф. = доля прибыли ÷ доля тоннажа. Зелёный &gt; 1,1 (группа даёт прибыли больше, чем занимает тоннажа). Красный &lt; 0,9 (наоборот).</p>`;
  setupSortHandlers(el);
}

// === 7. STRUCTURE SCENARIO ===
function renderStructure(kpi, records) {
  const el = document.getElementById('page-structure');

  const grpMap = {};
  CUBE.groups.forEach((g, gi) => {
    grpMap[gi] = { name: g, rev: 0, cost: 0, tons: 0 };
  });

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const gid = r[4];
    if (grpMap[gid]) {
      grpMap[gid].rev += r[8];
      grpMap[gid].cost += r[9];
      grpMap[gid].tons += r[10];
    }
  }

  const grps = Object.values(grpMap).filter(g => g.rev > 0).map(g => {
    const gp = g.rev - g.cost;
    return {
      name: g.name,
      rev: g.rev,
      gp: gp,
      tons: g.tons,
      margin: g.rev ? (gp / g.rev * 100) : 0,
      gpt: g.tons ? (gp / g.tons) : 0,
      shareTons: kpi.tons ? (g.tons / kpi.tons * 100) : 0
    };
  }).sort((a,b) => b.rev - a.rev);

  const totalGP = grps.reduce((s,g) => s + g.gp, 0);

  el.innerHTML = renderKPICards(kpi) + `
  <div class="tbl-wrap"><div class="tbl-title">Сценарий перераспределения тоннажа <span class="badge badge-blue">модель</span></div>
    <div class="tbl-scroll"><table><thead><tr><th>Группа</th><th class="num">Факт тонны</th><th class="num">% тоннажа</th><th class="num">Маржа</th><th class="num">Приб./т</th><th class="num">Факт прибыль</th><th class="num" style="background:#eef2ff">Δ тонны</th><th class="num" style="background:#eef2ff">Новые тонны</th><th class="num" style="background:#eef2ff">Расч. прибыль</th><th class="num" style="background:#eef2ff">Δ прибыль</th></tr></thead>
    <tbody id="structBody">${grps.map((g,i) => `<tr class="sortable-row" data-idx="${i}">
      <td><strong>${g.name}</strong></td>
      <td class="num">${fmtTons(g.tons)}</td>
      <td class="num">${g.shareTons.toFixed(1)}%</td>
      <td class="num ${marginClass(g.margin)}">${fmtPct(g.margin)}</td>
      <td class="num">${fmtFull(Math.round(g.gpt))}</td>
      <td class="num">${fmtFull(Math.round(g.gp))}</td>
      <td class="num" style="background:#f8faff"><input type="number" value="0" style="width:70px;text-align:right;border:1px solid #ddd;border-radius:4px;padding:2px 4px;font-size:12px" data-gpt="${g.gpt}" data-base-gp="${g.gp}" data-idx="${i}" onchange="recalcScenario()"></td>
      <td class="num scene-tons" style="background:#f8faff">${fmtTons(g.tons)}</td>
      <td class="num scene-gp" style="background:#f8faff">${fmtFull(Math.round(g.gp))}</td>
      <td class="num scene-delta" style="background:#f8faff">—</td>
    </tr>`).join('')}
    <tr class="total-row"><td>Итого</td><td class="num">${fmtTons(kpi.tons)}</td><td class="num">100%</td><td class="num">${fmtPct(kpi.margin)}</td><td class="num">${fmtFull(Math.round(kpi.gp_per_ton))}</td><td class="num">${fmtFull(Math.round(totalGP))}</td>
    <td class="num" style="background:#f8faff" id="scenTotalDeltaT">0</td><td class="num" style="background:#f8faff" id="scenTotalTons">${fmtTons(kpi.tons)}</td><td class="num" style="background:#f8faff" id="scenTotalGP">${fmtFull(Math.round(totalGP))}</td><td class="num" style="background:#f8faff" id="scenTotalDelta">—</td></tr>
    </tbody></table></div>
  </div>
  <p style="font-size:11px;color:var(--text2);margin-top:4px">Введите изменение тоннажа (±) для каждой группы. Расчётная прибыль = (факт тонны + Δ) × факт прибыль/т. Это модель, не прогноз.</p>`;
  setupSortHandlers(el);
}

window.recalcScenario = function() {
  const inputs = document.querySelectorAll('#structBody input[type=number]');
  let totalDeltaT = 0, totalNewGP = 0, totalBaseGP = 0;
  inputs.forEach(inp => {
    const row = inp.closest('tr');
    const delta = parseFloat(inp.value) || 0;
    const gpt = parseFloat(inp.dataset.gpt) || 0;
    const baseGP = parseFloat(inp.dataset.baseGp) || 0;
    const baseTons = baseGP / (gpt || 1);
    const newTons = baseTons + delta;
    const newGP = newTons * gpt;
    const deltaGP = newGP - baseGP;
    totalDeltaT += delta;
    totalNewGP += newGP;
    totalBaseGP += baseGP;
    row.querySelector('.scene-tons').textContent = fmtTons(newTons);
    row.querySelector('.scene-gp').textContent = fmtFull(Math.round(newGP));
    const dEl = row.querySelector('.scene-delta');
    dEl.textContent = (deltaGP >= 0 ? '+' : '') + fmtFull(Math.round(deltaGP));
    dEl.className = 'num scene-delta ' + (deltaGP > 0 ? 'pos' : deltaGP < 0 ? 'neg' : '');
  });
  document.getElementById('scenTotalDeltaT').textContent = (totalDeltaT >= 0 ? '+' : '') + fmtTons(totalDeltaT);
  document.getElementById('scenTotalTons').textContent = fmtTons(totalBaseGP / (totalBaseGP / (document.querySelectorAll('#structBody tr.sortable-row').length || 1)) + totalDeltaT);
  document.getElementById('scenTotalGP').textContent = fmtFull(Math.round(totalNewGP));
  const td = document.getElementById('scenTotalDelta');
  const totalDelta = totalNewGP - totalBaseGP;
  td.textContent = (totalDelta >= 0 ? '+' : '') + fmtFull(Math.round(totalDelta));
  td.className = 'num ' + (totalDelta > 0 ? 'pos' : totalDelta < 0 ? 'neg' : '');
};

function setupSortHandlers(container) {
  container.querySelectorAll('table').forEach(table => {
    table.querySelectorAll('th').forEach((th, i) => {
      th.innerHTML += '<span class="sort-arrow">▾</span>';
      th.addEventListener('click', () => sortTable(table, i, th.classList.contains('num')));
    });
  });
}

<script>
// === CRYPTO: AES-256-GCM decryption via Web Crypto API ===
async function decryptData(password, encB64) {
  const raw = Uint8Array.from(atob(encB64), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const ct = raw.slice(28);
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(decrypted);
}

async function doLogin() {
  const pwd = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  const inp = document.getElementById('loginPassword');
  if (!pwd) { errEl.textContent = 'Введите пароль'; inp.classList.add('error'); return; }
  btn.textContent = 'Расшифровка…';
  btn.disabled = true;
  errEl.textContent = '';
  inp.classList.remove('error');
  await new Promise(r => setTimeout(r, 50));
  try {
    const json = await decryptData(pwd, ENCRYPTED_DATA);
    const data = JSON.parse(json);
    sessionStorage.setItem('mz_auth', pwd);
    document.getElementById('loginOverlay').style.display = 'none';
    const dw = document.getElementById('dashboardWrap');
    dw.style.display = 'flex';
    init(data);
  } catch (e) {
    console.error('Login/decryption error:', e);
    btn.textContent = 'Войти';
    btn.disabled = false;
    errEl.textContent = 'Неверный пароль';
    inp.classList.add('error');
    inp.value = '';
    inp.focus();
  }
}

document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

(async function() {
  const saved = sessionStorage.getItem('mz_auth');
  if (saved) {
    try {
      const json = await decryptData(saved, ENCRYPTED_DATA);
      const data = JSON.parse(json);
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('dashboardWrap').style.display = 'flex';
      init(data);
    } catch(e) {
      sessionStorage.removeItem('mz_auth');
      document.getElementById('loginPassword').focus();
    }
  } else {
    document.getElementById('loginPassword').focus();
  }
})();
</script>
